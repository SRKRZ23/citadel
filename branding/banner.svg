<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- White background -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- Left vertical stripe -->
  <rect x="0" y="0" width="8" height="1080" fill="#059669"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1920" height="4" fill="#059669"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="1076" width="1920" height="4" fill="#059669"/>

  <!-- RIGHT SIDE: decorative tower silhouette -->
  <!-- Main tower -->
  <rect x="1480" y="200" width="220" height="680" fill="#F0FDF4"/>
  <!-- Battlements -->
  <rect x="1480" y="150" width="50" height="60" fill="#F0FDF4"/>
  <rect x="1545" y="150" width="55" height="60" fill="#F0FDF4"/>
  <rect x="1615" y="150" width="50" height="60" fill="#F0FDF4"/>
  <!-- Left turret -->
  <rect x="1390" y="320" width="95" height="560" fill="#F0FDF4"/>
  <rect x="1390" y="280" width="38" height="46" fill="#F0FDF4"/>
  <rect x="1445" y="280" width="40" height="46" fill="#F0FDF4"/>
  <!-- Right turret -->
  <rect x="1700" y="320" width="95" height="560" fill="#F0FDF4"/>
  <rect x="1700" y="280" width="38" height="46" fill="#F0FDF4"/>
  <rect x="1755" y="280" width="40" height="46" fill="#F0FDF4"/>

