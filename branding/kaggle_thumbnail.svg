<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#222" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="560" height="280" fill="url(#bgGrad)"/>
  <rect width="560" height="280" fill="url(#grid)"/>

  <!-- Accent stripe left -->
  <rect x="0" y="0" width="6" height="280" fill="#E91E63"/>

  <!-- CITADEL wordmark -->
  <text x="30" y="68" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="48" fill="#FFFFFF" letter-spacing="6">CITADEL</text>

  <!-- Subtitle -->
  <text x="30" y="100" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="14" fill="#888" letter-spacing="2">OPEN AI EVALUATION INFRASTRUCTURE</text>

  <!-- Tag line -->
  <text x="30" y="130" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="18" fill="#E91E63" letter-spacing="0">Gemma 4 27B in a Fair Fight</text>

  <!-- Stats row -->
  <g transform="translate(30, 155)">
    <!-- 13 Layers -->
    <rect x="0" y="0" width="115" height="58" fill="#0F1E3D" stroke="#2563EB" stroke-width="1.5" rx="4"/>
    <text x="57" y="26" font-family="-apple-system, sans-serif"
          font-weight="900" font-size="22" fill="#2563EB" text-anchor="middle">13</text>
    <text x="57" y="46" font-family="-apple-system, sans-serif"
          font-weight="500" font-size="9" fill="#888" text-anchor="middle" letter-spacing="1.5">LAYERS L0–L12</text>

    <!-- 49/49 -->
    <rect x="125" y="0" width="115" height="58" fill="#0F2D0F" stroke="#00CC66" stroke-width="1.5" rx="4"/>
    <text x="182" y="26" font-family="-apple-system, sans-serif"
          font-weight="900" font-size="22" fill="#00CC66" text-anchor="middle">49/49</text>
    <text x="182" y="46" font-family="-apple-system, sans-serif"
          font-weight="500" font-size="9" fill="#888" text-anchor="middle" letter-spacing="1.5">TESTS PASS</text>

    <!-- 6 models -->
    <rect x="250" y="0" width="115" height="58" fill="#1A0F00" stroke="#FF8C00" stroke-width="1.5" rx="4"/>
    <text x="307" y="26" font-family="-apple-system, sans-serif"
          font-weight="900" font-size="22" fill="#FF8C00" text-anchor="middle">6</text>
    <text x="307" y="46" font-family="-apple-system, sans-serif"
          font-weight="500" font-size="9" fill="#888" text-anchor="middle" letter-spacing="1.5">FRONTIER MODELS</text>

    <!-- SHA-256 -->
    <rect x="375" y="0" width="155" height="58" fill="#2A0F1F" stroke="#E91E63" stroke-width="1.5" rx="4"/>
    <text x="453" y="26" font-family="-apple-system, sans-serif"
          font-weight="900" font-size="18" fill="#E91E63" text-anchor="middle">SHA-256 + Ed25519</text>
    <text x="453" y="46" font-family="-apple-system, sans-serif"
          font-weight="500" font-size="9" fill="#888" text-anchor="middle" letter-spacing="1.5">AUDIT CHAIN</text>
  </g>

  <!-- Footer -->
  <text x="30" y="245" font-family="-apple-system, sans-serif"
        font-weight="500" font-size="11" fill="#666" letter-spacing="1">SARDOR RAZIKOV · TASHKENT · github.com/SRKRZ23/citadel · MIT</text>
  <text x="30" y="265" font-family="-apple-system, sans-serif"
        font-weight="400" font-size="10" fill="#444" letter-spacing="0.5">Gemma is a trademark of Google LLC.</text>
</svg>
