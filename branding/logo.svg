<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- White background -->
  <rect width="400" height="400" fill="#FFFFFF"/>

  <!-- Left vertical stripe -->
  <rect x="0" y="0" width="8" height="400" fill="#059669"/>

  <!-- Citadel tower — geometric battlements -->
  <!-- Main tower body -->
  <rect x="150" y="160" width="100" height="120" fill="#059669"/>

  <!-- Tower battlements (3 merlons) -->
  <rect x="150" y="130" width="25" height="35" fill="#059669"/>
  <rect x="187" y="130" width="26" height="35" fill="#059669"/>
  <rect x="225" y="130" width="25" height="35" fill="#059669"/>

  <!-- Side turrets -->
  <rect x="118" y="185" width="36" height="95" fill="#059669"/>
  <rect x="246" y="185" width="36" height="95" fill="#059669"/>

  <!-- Side turret battlements -->
  <rect x="118" y="165" width="14" height="24" fill="#059669"/>
  <rect x="140" y="165" width="14" height="24" fill="#059669"/>
  <rect x="246" y="165" width="14" height="24" fill="#059669"/>
  <rect x="268" y="165" width="14" height="24" fill="#059669"/>

  <!-- Gate arch (dark) -->
  <rect x="180" y="225" width="40" height="55" fill="#0A0A0A"/>
  <ellipse cx="200" cy="225" rx="20" ry="12" fill="#0A0A0A"/>

  <!-- "C" letter inside main tower -->
  <text x="200" y="210" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">C</text>

  <!-- CITADEL text -->
  <text x="200" y="320" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="900" fill="#0A0A0A" text-anchor="middle" letter-spacing="8">CITADEL</text>

  <!-- Tagline -->
  <text x="200" y="355" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5A5A5A" text-anchor="middle" letter-spacing="2">CONSUMER REPORTS FOR AI</text>

  <!-- Bottom accent line -->
  <rect x="80" y="368" width="240" height="2" fill="#059669"/>

  <!-- 49/49 badge -->
  <rect x="148" y="378" width="104" height="16" rx="8" fill="#059669"/>
  <text x="200" y="389" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">49/49 TESTS PASS</text>
</svg>
