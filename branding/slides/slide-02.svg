  <text x="960" y="715" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#059669" text-anchor="middle">CITADEL: MIT licensed · DOI-citable · Tamper-evident · Reproducible · Federated DP · Regulatory reports</text>
  <text x="960" y="742" font-family="Arial, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">Any researcher · Any model · Any regulatory framework · Free forever · github.com/SRKRZ23/citadel</text>

  <!-- Source -->
  <text x="960" y="1055" font-family="monospace, Courier New" font-size="12" fill="#5A5A5A" text-anchor="middle">Sources: eur-lex.europa.eu/AI-Act Art.43 · technologyreview.com/2025 · helm.cs.stanford.edu · zenodo.org/10.5281/zenodo.19791329</text>
