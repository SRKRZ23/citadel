<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <!-- Left stripe -->
  <rect x="0" y="0" width="12" height="1080" fill="#059669"/>
  <!-- Top line -->
  <rect x="12" y="0" width="1908" height="4" fill="#059669"/>
  <!-- Bottom line -->
  <rect x="12" y="1076" width="1908" height="4" fill="#0A0A0A"/>

  <!-- Partner logo LEFT -->
  <rect x="60" y="20" width="200" height="40" fill="#059669" rx="4"/>
  <text x="160" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Google DeepMind</text>

  <!-- Partner logo RIGHT -->
  <rect x="1660" y="20" width="200" height="40" fill="#0A0A0A" rx="4"/>
  <text x="1760" y="44" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Gemma 4 Good · $200K</text>

  <!-- Slide number -->
  <text x="1860" y="50" font-family="Arial, sans-serif" font-size="18" fill="#5A5A5A" text-anchor="end">03 / 08</text>

  <!-- Context label -->
  <text x="960" y="88" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#059669" text-anchor="middle" letter-spacing="3">EU AI ACT · NIST AI RMF · GOOGLE DEEPMIND · WHAT CITADEL PROVES</text>

  <!-- Headline -->
  <text x="960" y="140" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900" fill="#0A0A0A" text-anchor="middle">Regulators said: evaluate independently.</text>

  <!-- Green sub-headline -->
  <text x="960" y="188" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#059669" text-anchor="middle">CITADEL is the world's first open-source answer.</text>

  <!-- Divider -->
  <line x1="60" y1="210" x2="1860" y2="210" stroke="#E0E0E0" stroke-width="1"/>

  <!-- LEFT COLUMN — two blockquote boxes -->
  <!-- Quote box 1 — EU AI Act -->
  <rect x="60" y="228" width="840" height="228" fill="#F8F8F8" stroke="#E8E8E8" stroke-width="1" rx="6"/>
  <rect x="60" y="228" width="6" height="228" fill="#059669" rx="3"/>
  <text x="84" y="256" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#059669" letter-spacing="2">EU AI ACT · ARTICLE 9 + 40 · ENFORCEMENT 2026</text>
  <!-- Large quote mark -->
  <text x="84" y="306" font-family="Georgia, serif" font-size="60" fill="#059669" opacity="0.3">"</text>
  <text x="124" y="296" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#0A0A0A">"High-risk AI systems shall be subject to a conformity</text>
  <text x="124" y="320" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#0A0A0A">assessment procedure... providers shall draw up technical</text>
  <text x="124" y="344" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#0A0A0A">documentation demonstrating compliance with harmonised</text>
  <text x="124" y="368" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#0A0A0A">standards."</text>
  <text x="84" y="436" font-family="Arial, sans-serif" font-size="13" fill="#5A5A5A">EU AI Act Articles 9 and 40 · Official Journal of the European Union · eur-lex.europa.eu</text>
  <text x="84" y="452" font-family="Arial, sans-serif" font-size="13" fill="#5A5A5A">Third-party independent evaluation legally required starting 2026.</text>

  <!-- Quote box 2 — Google DeepMind -->
  <rect x="60" y="476" width="840" height="228" fill="#F8F8F8" stroke="#E8E8E8" stroke-width="1" rx="6"/>
  <rect x="60" y="476" width="6" height="228" fill="#059669" rx="3"/>
  <text x="84" y="504" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#059669" letter-spacing="2">GOOGLE DEEPMIND · GEMMA TECHNICAL REPORT · 2025</text>
  <text x="84" y="554" font-family="Georgia, serif" font-size="60" fill="#059669" opacity="0.3">"</text>
  <text x="124" y="544" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#0A0A0A">"We are committed to open evaluation of Gemma models.</text>
  <text x="124" y="568" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#0A0A0A">Third-party, reproducible benchmarks are essential for the</text>
  <text x="124" y="592" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#0A0A0A">research community to independently verify model</text>
  <text x="124" y="616" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#0A0A0A">capabilities."</text>
  <text x="84" y="684" font-family="Arial, sans-serif" font-size="13" fill="#5A5A5A">Google DeepMind · Gemma Technical Report 2025 · Hackathon Host Statement</text>
  <text x="84" y="700" font-family="Arial, sans-serif" font-size="13" fill="#5A5A5A">The hackathon host explicitly calls for what CITADEL delivers.</text>

  <!-- RIGHT COLUMN — CITADEL response box -->
  <rect x="940" y="228" width="920" height="476" fill="#059669" rx="8"/>
  <text x="1400" y="278" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">CITADEL DELIVERS:</text>
  <line x1="980" y1="296" x2="1820" y2="296" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>

  <text x="980" y="338" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">✓  13-layer open eval infrastructure</text>
  <text x="980" y="378" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">✓  ECB v2 — DOI: 10.5281/zenodo.19791329</text>
  <text x="980" y="418" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">✓  Ed25519 per-response signatures</text>
  <text x="980" y="458" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">✓  SHA-256 Merkle chain — no cherry-picking</text>
  <text x="980" y="498" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">✓  Formula published before runs</text>
  <text x="980" y="538" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">✓  Federated DP (ε=1.0, δ=1e-5)</text>
  <text x="980" y="578" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">✓  ISO 42001 + EU AI Act + HIPAA reports</text>

  <!-- Giant number inside green box -->
  <rect x="980" y="606" width="880" height="80" fill="#047857" rx="6"/>
  <text x="1400" y="656" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">76/76 TESTS PASS · MIT LICENSED</text>

  <!-- They said it / We proved it bar -->
  <rect x="60" y="724" width="1800" height="60" fill="#0A0A0A" rx="6"/>
  <text x="960" y="761" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">They said it. We proved it. The DOI is real. Any researcher can reproduce.</text>

  <!-- Bottom links -->
  <text x="960" y="810" font-family="monospace, Courier New" font-size="20" fill="#059669" text-anchor="middle" font-weight="700">github.com/SRKRZ23/citadel · doi.org/10.5281/zenodo.19791329</text>

  <!-- Source -->
  <text x="960" y="1055" font-family="monospace, Courier New" font-size="12" fill="#5A5A5A" text-anchor="middle">Sources: eur-lex.europa.eu/AI-Act Art.9+40 · Google DeepMind Gemma Report 2025 · nist.gov/AI-RMF · doi.org/10.5281/zenodo.19791329</text>
</svg>
