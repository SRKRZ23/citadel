<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <!-- Left stripe -->
  <rect x="0" y="0" width="12" height="1080" fill="#059669"/>
  <!-- Top line -->
  <rect x="12" y="0" width="1908" height="4" fill="#059669"/>
  <!-- Bottom line -->
  <rect x="12" y="1076" width="1908" height="4" fill="#0A0A0A"/>

  <!-- Partner logo LEFT -->
  <rect x="60" y="20" width="200" height="40" fill="#059669" rx="4"/>
  <text x="160" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Google DeepMind</text>

  <!-- Partner logo RIGHT -->
  <rect x="1660" y="20" width="200" height="40" fill="#0A0A0A" rx="4"/>
  <text x="1760" y="44" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Gemma 4 Good · $200K</text>

  <!-- Slide number -->
  <text x="1860" y="50" font-family="Arial, sans-serif" font-size="18" fill="#5A5A5A" text-anchor="end">06 / 08</text>

  <!-- Context label -->
  <text x="960" y="88" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#059669" text-anchor="middle" letter-spacing="3">TAMPER-EVIDENT · ED25519 SIGNATURES · SHA-256 MERKLE CHAIN · L7 AUDIT</text>

  <!-- Title -->
  <text x="960" y="148" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" fill="#0A0A0A" text-anchor="middle">No cherry-picking possible. Here's the math.</text>

  <!-- Divider -->
  <line x1="60" y1="168" x2="1860" y2="168" stroke="#E0E0E0" stroke-width="1"/>

  <!-- LEFT — 5-step verification -->
  <text x="60" y="208" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#059669" letter-spacing="2">HOW THE TAMPER-PROOF CHAIN WORKS</text>

  <!-- Step 1 -->
  <rect x="60" y="222" width="840" height="88" fill="#F4F4F4" stroke="#E0E0E0" stroke-width="1" rx="6"/>
  <rect x="60" y="222" width="6" height="88" fill="#059669" rx="3"/>
  <circle cx="104" cy="264" r="20" fill="#059669"/>
  <text x="104" y="270" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="138" y="254" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0A0A0A">Composite formula published BEFORE any run</text>
  <text x="138" y="278" font-family="Arial, sans-serif" font-size="15" fill="#5A5A5A">Weights frozen at commit time. Immutable. Timestamped on Zenodo DOI.</text>
  <text x="138" y="300" font-family="Arial, sans-serif" font-size="15" fill="#5A5A5A">No post-hoc metric selection possible.</text>

  <!-- Step 2 -->
  <rect x="60" y="322" width="840" height="88" fill="#F4F4F4" stroke="#E0E0E0" stroke-width="1" rx="6"/>
  <rect x="60" y="322" width="6" height="88" fill="#059669" rx="3"/>
  <circle cx="104" cy="364" r="20" fill="#059669"/>
  <text x="104" y="370" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="138" y="354" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0A0A0A">Each response signed with Ed25519 private key</text>
  <text x="138" y="378" font-family="Arial, sans-serif" font-size="15" fill="#5A5A5A">PyNaCl Ed25519 — 256-bit elliptic curve digital signature.</text>
  <text x="138" y="400" font-family="Arial, sans-serif" font-size="15" fill="#5A5A5A">Signature covers: model + item + correct + latency_ms.</text>

  <!-- Step 3 -->
  <rect x="60" y="422" width="840" height="88" fill="#F4F4F4" stroke="#E0E0E0" stroke-width="1" rx="6"/>
  <rect x="60" y="422" width="6" height="88" fill="#059669" rx="3"/>
  <circle cx="104" cy="464" r="20" fill="#059669"/>
  <text x="104" y="470" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="138" y="454" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0A0A0A">SHA-256 Merkle chain links every record</text>
  <text x="138" y="478" font-family="monospace, Courier New" font-size="14" fill="#059669">hash_n = sha256(record_n + hash_{n-1})</text>
  <text x="138" y="500" font-family="Arial, sans-serif" font-size="15" fill="#5A5A5A">Sequential dependency — chain breaks if anything modified.</text>

  <!-- Step 4 -->
  <rect x="60" y="522" width="840" height="88" fill="#F4F4F4" stroke="#E0E0E0" stroke-width="1" rx="6"/>
  <rect x="60" y="522" width="6" height="88" fill="#DC2626" rx="3"/>
  <circle cx="104" cy="564" r="20" fill="#DC2626"/>
  <text x="104" y="570" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="138" y="554" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0A0A0A">Modify ANY record → downstream hashes invalidate</text>
  <text x="138" y="578" font-family="Arial, sans-serif" font-size="15" fill="#5A5A5A">Mathematical impossibility: SHA-256 collision resistance = 2^128 operations.</text>
  <text x="138" y="600" font-family="Arial, sans-serif" font-size="15" fill="#5A5A5A">Cherry-picking is computationally infeasible.</text>

  <!-- Step 5 -->
  <rect x="60" y="622" width="840" height="88" fill="#D1FAE5" stroke="#059669" stroke-width="2" rx="6"/>
  <rect x="60" y="622" width="6" height="88" fill="#059669" rx="3"/>
  <circle cx="104" cy="664" r="20" fill="#059669"/>
  <text x="104" y="670" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="138" y="654" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#059669">Anyone can verify from public audit chain</text>
  <text x="138" y="678" font-family="monospace, Courier New" font-size="14" fill="#059669">chain.verify_chain() → all records valid</text>
  <text x="138" y="700" font-family="Arial, sans-serif" font-size="15" fill="#059669" font-weight="700">Tested in test_citadel.py. Passes 76/76.</text>

  <!-- RIGHT — dark code block -->
  <rect x="940" y="200" width="920" height="430" fill="#0A0A0A" rx="8"/>
  <text x="980" y="236" font-family="monospace, Courier New" font-size="14" fill="#059669">// CITADEL L7 AUDIT RECORD — ACTUAL FORMAT</text>
  <text x="980" y="268" font-family="monospace, Courier New" font-size="15" fill="#FFFFFF">{</text>
  <text x="1010" y="296" font-family="monospace, Courier New" font-size="15" fill="#E5E7EB">  "model":       <tspan fill="#86EFAC">"gemma4"</tspan>,</text>
  <text x="1010" y="320" font-family="monospace, Courier New" font-size="15" fill="#E5E7EB">  "item":        <tspan fill="#86EFAC">"ECB-001"</tspan>,</text>
  <text x="1010" y="344" font-family="monospace, Courier New" font-size="15" fill="#E5E7EB">  "correct":     <tspan fill="#86EFAC">true</tspan>,</text>
  <text x="1010" y="368" font-family="monospace, Courier New" font-size="15" fill="#E5E7EB">  "latency_ms":  <tspan fill="#86EFAC">245.3</tspan>,</text>
  <text x="1010" y="392" font-family="monospace, Courier New" font-size="15" fill="#E5E7EB">  "signature":   <tspan fill="#FCD34D">"ed25519:a3f1b2c4d5e6..."</tspan>,</text>
  <text x="1010" y="416" font-family="monospace, Courier New" font-size="15" fill="#E5E7EB">  "prev_hash":   <tspan fill="#FCD34D">"sha256:c9d8e7f6a5..."</tspan>,</text>
  <text x="1010" y="440" font-family="monospace, Courier New" font-size="15" fill="#E5E7EB">  "chain_valid": <tspan fill="#86EFAC">true</tspan></text>
  <text x="980" y="464" font-family="monospace, Courier New" font-size="15" fill="#FFFFFF">}</text>
  <line x1="980" y1="482" x2="1820" y2="482" stroke="#333" stroke-width="1"/>
  <text x="980" y="506" font-family="monospace, Courier New" font-size="14" fill="#9CA3AF">$ python src/test_citadel.py</text>
  <text x="980" y="528" font-family="monospace, Courier New" font-size="14" fill="#9CA3AF">Running 49 tests across 13 layers...</text>
  <text x="980" y="550" font-family="monospace, Courier New" font-size="16" fill="#86EFAC" font-weight="700">✓ L7 audit chain valid · 76/76 PASS</text>
  <text x="980" y="580" font-family="monospace, Courier New" font-size="13" fill="#6B7280">PyNaCl Ed25519 + SHA-256 fallback</text>
  <text x="980" y="600" font-family="monospace, Courier New" font-size="13" fill="#6B7280">chain.verify_chain() → all records valid</text>

  <!-- DP formula box -->
  <rect x="940" y="648" width="920" height="102" fill="#059669" rx="8"/>
  <text x="960" y="677" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="2">L9 FEDERATED DP — GAUSSIAN MECHANISM FORMULA</text>
  <text x="960" y="706" font-family="monospace, Courier New" font-size="17" fill="#FFFFFF">σ = sensitivity × √(2 ln(1.25/δ)) / ε = 0.000430</text>
  <text x="960" y="734" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">ε=1.0 · δ=1e-5 · Zero raw response data leaves participating orgs</text>

  <!-- Bottom bar -->
  <rect x="60" y="770" width="1800" height="70" rx="6" fill="#F4F4F4" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="60" y="770" width="6" height="70" fill="#059669" rx="3"/>
  <text x="84" y="800" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#059669" letter-spacing="2">INDEPENDENTLY VERIFIED TAMPER-EVIDENCE</text>
  <text x="84" y="826" font-family="Arial, sans-serif" font-size="17" fill="#0A0A0A">The only AI evaluation infrastructure where cherry-picking is mathematically impossible by construction.</text>

  <!-- Source -->
  <text x="960" y="1055" font-family="monospace, Courier New" font-size="12" fill="#5A5A5A" text-anchor="middle">src/l7_audit/audit_chain.py · PyNaCl Ed25519 + SHA-256 fallback · chain.verify_chain() tested in test_citadel.py</text>
</svg>
