<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="1200" height="700" fill="#0f1117"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="1">CITADEL — Open AI Evaluation Infrastructure</text>
  <text x="600" y="63" text-anchor="middle" font-size="13" fill="#6b7280">12-Layer Stack · Consumer Reports for AI · AMD MI300X · Ed25519 Audit Chain</text>

  <!-- Layer columns -->
  <!-- Left column: L0-L3 -->
  <!-- Center column: L4-L7 (core eval) -->
  <!-- Right column: L8-L12 (advanced) -->

  <!-- L0: Network -->
  <rect x="30" y="90" width="200" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="130" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">L0 Network / Security</text>
  <text x="130" y="133" text-anchor="middle" font-size="10" fill="#64748b">TLS 1.3 · mTLS · Auth · Rate limit</text>

  <!-- L1: Hardware -->
  <rect x="30" y="165" width="200" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="130" y="191" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">L1 Hardware Abstraction</text>
  <text x="130" y="208" text-anchor="middle" font-size="10" fill="#22d3ee">AMD MI300X (ROCm) / CUDA / CPU</text>

  <!-- L2: Task Suites -->
  <rect x="30" y="240" width="200" height="75" rx="8" fill="#0d1f3c" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#93c5fd">L2 Task Suites</text>
  <text x="130" y="278" text-anchor="middle" font-size="10" fill="#94a3b8">ECB v2 (DOI:10.5281/zenodo.19791329)</text>
  <text x="130" y="293" text-anchor="middle" font-size="10" fill="#94a3b8">MMLU-Pro · HumanEval</text>
  <text x="130" y="308" text-anchor="middle" font-size="10" fill="#94a3b8">Multilingual MMLU (14 languages)</text>

  <!-- L3: Model Adapters -->
  <rect x="30" y="330" width="200" height="85" rx="8" fill="#0d1f3c" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="130" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#c4b5fd">L3 Model Adapters</text>
  <text x="130" y="368" text-anchor="middle" font-size="10" fill="#22d3ee">★ Gemma 4 27B (Google)</text>
  <text x="130" y="383" text-anchor="middle" font-size="10" fill="#94a3b8">Llama 4 Scout · Claude Haiku 4.5</text>
  <text x="130" y="398" text-anchor="middle" font-size="10" fill="#94a3b8">GPT-4o mini · Qwen3-35B · Mistral-7B</text>
  <text x="130" y="411" text-anchor="middle" font-size="9" fill="#475569">via vLLM local + Featherless API</text>

  <!-- L4: Metrics (center) -->
  <rect x="280" y="90" width="240" height="110" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
  <rect x="280" y="90" width="240" height="26" rx="8" fill="#064e3b"/>
  <rect x="280" y="104" width="240" height="12" rx="0" fill="#064e3b"/>
  <text x="400" y="107" text-anchor="middle" font-size="12" font-weight="700" fill="#6ee7b7">L4 Metrics Engine</text>
  <text x="296" y="128" font-size="10" fill="#94a3b8">· ECE calibration error</text>
  <text x="296" y="143" font-size="10" fill="#94a3b8">· Hallucination rate (conf &gt; 0.8 + wrong)</text>
  <text x="296" y="158" font-size="10" fill="#94a3b8">· Refusal rate · Tokens/second</text>
  <text x="296" y="173" font-size="10" fill="#94a3b8">· Energy (joules, AMD MI300X)</text>
  <text x="296" y="190" font-size="9" fill="#475569">Brier score · Per-language variance</text>

  <!-- L5: Eval Infra -->
  <rect x="280" y="215" width="240" height="80" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="237" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">L5 Eval Infrastructure</text>
  <text x="296" y="254" font-size="10" fill="#94a3b8">· Docker reproducible runs</text>
  <text x="296" y="269" font-size="10" fill="#94a3b8">· SHA-256 run hash commitment</text>
  <text x="296" y="284" font-size="10" fill="#94a3b8">· CI/CD benchmark regression</text>

  <!-- L6: Dashboard -->
  <rect x="280" y="310" width="240" height="80" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#93c5fd">L6 Public Dashboard</text>
  <text x="296" y="349" font-size="10" fill="#94a3b8">· Streamlit leaderboard (live)</text>
  <text x="296" y="364" font-size="10" fill="#94a3b8">· 6 models × 4 suites</text>
  <text x="296" y="379" font-size="10" fill="#94a3b8">· Calibration &amp; hallucination charts</text>

  <!-- L7: Audit -->
  <rect x="280" y="405" width="240" height="80" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="400" y="427" text-anchor="middle" font-size="11" font-weight="700" fill="#6ee7b7">L7 Provenance · Ed25519 Audit</text>
  <text x="296" y="444" font-size="10" fill="#94a3b8">· Ed25519 sign per response</text>
  <text x="296" y="459" font-size="10" fill="#94a3b8">· SHA-256 prev_hash Merkle chain</text>
  <text x="296" y="474" font-size="9" fill="#475569">Reused from SOUF AI · HIPAA §164.312(b)</text>

  <!-- Right column: L8-L12 -->
  <!-- L8: Multi-cloud -->
  <rect x="580" y="90" width="260" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="710" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">L8 Multi-cloud Arbitrage</text>
  <text x="596" y="129" font-size="10" fill="#64748b">Auto-route: AMD MI300X → open models</text>
  <text x="596" y="144" font-size="10" fill="#64748b">Featherless → 0-cost API · EU sovereignty</text>
  <text x="596" y="159" font-size="9" fill="#475569">Cost/latency/compliance constraint engine</text>

  <!-- L9: Federated -->
  <rect x="580" y="180" width="260" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="710" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">L9 Federated Network</text>
  <text x="596" y="219" font-size="10" fill="#64748b">Multi-org eval without sharing data</text>
  <text x="596" y="234" font-size="10" fill="#64748b">(ε=1.0, δ=1e-5)-DP Gaussian mechanism</text>
  <text x="596" y="249" font-size="9" fill="#475569">HMAC-verified contributions · Weighted agg</text>

  <!-- L10: Regulatory -->
  <rect x="580" y="270" width="260" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="710" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">L10 Regulatory Translator</text>
  <text x="596" y="309" font-size="10" fill="#64748b">EU AI Act · NIST AI RMF · UK AISI</text>
  <text x="596" y="324" font-size="10" fill="#64748b">HIPAA · PCI-DSS · ISO 42001</text>
  <text x="596" y="339" font-size="9" fill="#475569">Auto-generates compliance reports</text>

  <!-- L11: Router -->
  <rect x="580" y="360" width="260" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="710" y="382" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">L11 Intelligent Router</text>
  <text x="596" y="399" font-size="10" fill="#64748b">Task-type routing (code/medical/multilingual)</text>
  <text x="596" y="414" font-size="10" fill="#64748b">Cost budget + compliance filter</text>
  <text x="596" y="429" font-size="9" fill="#475569">Powered by CITADEL leaderboard data</text>

  <!-- L12: Marketplace -->
  <rect x="580" y="450" width="260" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="710" y="472" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">L12 AI Marketplace</text>
  <text x="596" y="489" font-size="10" fill="#64748b">Domain FT models · 70/30 revenue split</text>
  <text x="596" y="504" font-size="10" fill="#64748b">CITADEL eval required before listing</text>
  <text x="596" y="519" font-size="9" fill="#475569">Reproducible model card per listing</text>

  <!-- Arrows L0→L1→L2→L3 -->
  <line x1="130" y1="150" x2="130" y2="163" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="130" y1="225" x2="130" y2="238" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="130" y1="315" x2="130" y2="328" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- L2+L3 → L4 (eval) -->
  <line x1="230" y1="278" x2="278" y2="145" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)" stroke-dasharray="4,2"/>
  <line x1="230" y1="372" x2="278" y2="200" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)" stroke-dasharray="4,2"/>

  <!-- L4→L5→L6→L7 vertical -->
  <line x1="400" y1="200" x2="400" y2="213" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="400" y1="295" x2="400" y2="308" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="400" y1="390" x2="400" y2="403" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- L5 → L8/L9/L10 -->
  <line x1="520" y1="255" x2="578" y2="200" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowOrange)" stroke-dasharray="4,2"/>
  <line x1="520" y1="255" x2="578" y2="305" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowOrange)" stroke-dasharray="4,2"/>

  <!-- L6 → L11 -->
  <line x1="520" y1="350" x2="578" y2="397" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)" stroke-dasharray="4,2"/>

  <!-- Bottom stats bar -->
  <rect x="30" y="570" width="1140" height="70" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>

  <text x="120" y="595" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280">MODELS</text>
  <text x="120" y="615" text-anchor="middle" font-size="20" font-weight="700" fill="#22d3ee">6</text>
  <text x="120" y="630" text-anchor="middle" font-size="10" fill="#475569">Gemma 4 + 5 competitors</text>

  <line x1="220" y1="575" x2="220" y2="635" stroke="#1f2937" stroke-width="1"/>

  <text x="320" y="595" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280">SUITES</text>
  <text x="320" y="615" text-anchor="middle" font-size="20" font-weight="700" fill="#22d3ee">4</text>
  <text x="320" y="630" text-anchor="middle" font-size="10" fill="#475569">ECB v2 · MMLU · HumanEval · ML</text>

  <line x1="440" y1="575" x2="440" y2="635" stroke="#1f2937" stroke-width="1"/>

  <text x="560" y="595" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280">LAYERS</text>
  <text x="560" y="615" text-anchor="middle" font-size="20" font-weight="700" fill="#22d3ee">12</text>
  <text x="560" y="630" text-anchor="middle" font-size="10" fill="#475569">L0 Network → L12 Marketplace</text>

  <line x1="680" y1="575" x2="680" y2="635" stroke="#1f2937" stroke-width="1"/>

  <text x="800" y="595" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280">AUDIT</text>
  <text x="800" y="615" text-anchor="middle" font-size="20" font-weight="700" fill="#22d3ee">Ed25519</text>
  <text x="800" y="630" text-anchor="middle" font-size="10" fill="#475569">Per-response signed · Merkle chain</text>

  <line x1="920" y1="575" x2="920" y2="635" stroke="#1f2937" stroke-width="1"/>

  <text x="1040" y="595" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280">ECB DOI</text>
  <text x="1040" y="612" text-anchor="middle" font-size="12" font-weight="700" fill="#22d3ee">10.5281</text>
  <text x="1040" y="626" text-anchor="middle" font-size="10" fill="#22d3ee">/zenodo.19791329</text>
  <text x="1040" y="638" text-anchor="middle" font-size="9" fill="#475569">Citable · Reproducible</text>

  <!-- Gemma 4 highlight box -->
  <rect x="855" y="90" width="310" height="100" rx="10" fill="#0d1f3c" stroke="#22d3ee" stroke-width="2"/>
  <text x="1010" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#22d3ee">★ Gemma 4 on CITADEL</text>
  <text x="1010" y="133" text-anchor="middle" font-size="11" fill="#94a3b8">Third-party, citable evaluation</text>
  <text x="1010" y="151" text-anchor="middle" font-size="11" fill="#94a3b8">No cherry-picking — every response signed</text>
  <text x="1010" y="169" text-anchor="middle" font-size="10" fill="#6b7280">Google gets reproducible benchmark evidence</text>
  <text x="1010" y="184" text-anchor="middle" font-size="10" fill="#475569">AMD MI300X · ROCm · bfloat16</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
    </marker>
  </defs>
</svg>
